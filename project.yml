name: TabMailDesktop
options:
  bundleIdPrefix: ai.tabmail
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM is sourced from the gitignored Secrets.xcconfig by
    # Scripts/xcodegen.sh (see Secrets.xcconfig.example), so the Team ID stays
    # out of the public repo. Always generate via that script.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  TabMailDesktop:
    type: application
    platform: macOS
    sources:
      - path: TabMailDesktop
        excludes:
          - "Resources/Info.plist"
          - "Resources/TabMailDesktop.entitlements"
    info:
      path: TabMailDesktop/Resources/Info.plist
      properties:
        CFBundleDisplayName: TabMail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSMicrophoneUsageDescription: TabMail listens only while you hold the dictation key.
    entitlements:
      path: TabMailDesktop/Resources/TabMailDesktop.entitlements
      properties:
        # Not sandboxed: the paste keystroke into other apps and the global
        # hotkey both need Accessibility, which the App Sandbox forbids.
        # Distribution is Developer ID + notarization (DECISIONS.md ADR-DESK-003).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tabmail.desktop
        PRODUCT_NAME: TabMail
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TabMailDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TabMailDesktopTests
    dependencies:
      - target: TabMailDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tabmail.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TabMail.app/Contents/MacOS/TabMail

schemes:
  TabMailDesktop:
    build:
      targets:
        TabMailDesktop: all
        TabMailDesktopTests: [test]
    test:
      targets:
        - TabMailDesktopTests
