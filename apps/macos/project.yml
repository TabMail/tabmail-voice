name: TabMailVoice
options:
  bundleIdPrefix: ai.tabmail
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  groupSortPosition: top

# At the repository root, where every worktree's copy is installed.
configFiles:
  Debug: ../../Secrets.xcconfig
  Release: ../../Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM is sourced from the gitignored Secrets.xcconfig by
    # apps/macos/Scripts/xcodegen.sh (see Secrets.xcconfig.example), so the Team ID stays
    # out of the public repo. Always generate via that script.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  TabMailVoice:
    type: application
    platform: macOS
    sources:
      - path: TabMailVoice
        excludes:
          - "Resources/Info.plist"
          - "Resources/TabMailVoice.entitlements"
    info:
      path: TabMailVoice/Resources/Info.plist
      properties:
        CFBundleDisplayName: TabMail Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu-bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSMicrophoneUsageDescription: TabMail Voice listens only while you hold the dictation key.
    entitlements:
      path: TabMailVoice/Resources/TabMailVoice.entitlements
      properties:
        # Not sandboxed: the paste keystroke into other apps and the global
        # hotkey both need Accessibility, which the App Sandbox forbids.
        # Distribution is Developer ID + notarization (DECISIONS.md ADR-DESK-003).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tabmail.voice
        # Not "TabMail": the Thunderbird installer puts its launcher at /Applications/TabMail.app.
        PRODUCT_NAME: TabMail Voice
        PRODUCT_MODULE_NAME: TabMailVoice
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TabMailVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TabMailVoiceTests
    dependencies:
      - target: TabMailVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tabmail.voice.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TabMail Voice.app/Contents/MacOS/TabMail Voice"

schemes:
  TabMailVoice:
    build:
      targets:
        TabMailVoice: all
        TabMailVoiceTests: [test]
    test:
      targets:
        - TabMailVoiceTests
