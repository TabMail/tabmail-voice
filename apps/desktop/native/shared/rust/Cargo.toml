[package]
name = "tabmail-voice-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "=1.0.151"
icu_casemap = "=2.3.0"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }
url = "=2.5.8"

[profile.release]
panic = "unwind"
