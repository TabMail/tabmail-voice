<!-- A mail editor shaped like Gmail's compose body: a contenteditable of one block a line, an empty
     line a block holding only a <br>, a bold run inside a line, and a signature at the end. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic compose</title>
  <style>
    body { margin: 0; font: 14px Arial, sans-serif; }
    #body { height: 90vh; overflow-y: auto; padding: 8px 16px; font: 14px/20px Arial, sans-serif; outline: none; }
  </style>
</head>
<body>
  <div id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message Body"></div>
  <script type="module" src="compose.mjs"></script>
</body>
</html>
