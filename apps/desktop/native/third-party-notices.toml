# cargo-about's configuration for `scripts/third-party-notices.mts`: the licences the Rust code
# Voice ships may be under, and the systems it is built for.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The napi crates (compiled into @napi-rs/keyring's module) ship no licence file, so cargo-about would
# fill in the MIT template, with no copyright holder; their repository's LICENSE is taken instead,
# from the commit each was published from.
[napi.clarify]
license = "MIT"
[[napi.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "3f1ce66533302df3a32edbfdfc0b78f0dd34659e4c1f5817162e5ea3c2297215"

[napi-sys.clarify]
license = "MIT"
[[napi-sys.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "3f1ce66533302df3a32edbfdfc0b78f0dd34659e4c1f5817162e5ea3c2297215"

[napi-derive.clarify]
license = "MIT"
[[napi-derive.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "3f1ce66533302df3a32edbfdfc0b78f0dd34659e4c1f5817162e5ea3c2297215"

[napi-derive-backend.clarify]
license = "MIT"
[[napi-derive-backend.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "3f1ce66533302df3a32edbfdfc0b78f0dd34659e4c1f5817162e5ea3c2297215"
